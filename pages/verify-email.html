<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - CORRIESELLS</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/pro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-wrapper">
            <div class="container">
                <div class="header-container">
                    <div class="logo">
                        <a href="../index.html">
                            <img src="../assets/images/logo.png" alt="CORRIESELLS Logo" class="logo-image">
                            <span>CORRIESELLS</span>
                        </a>
                    </div>

                    <nav class="auth-nav-hidden">
                        <ul></ul>
                    </nav>

                    <div class="header-icons">
                        <button class="nav-icon icon-btn" onclick="window.location.href='../index.html'">
                            <i class="fas fa-home"></i>
                        </button>
                        <button class="cart-icon icon-btn" onclick="window.location.href='shop.html'">
                            <i class="fas fa-shopping-bag"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="auth-page-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <h1><i class="fas fa-envelope"></i> Verify Your Email</h1>
                <p id="verifyStatus">Verifying your email now...</p>
            </div>

            <div class="success-message" id="verifySuccess">
                <i class="fas fa-check-circle"></i> Email verified! You can now sign in.
            </div>

            <div class="form-error" id="verifyError"></div>

            <div class="auth-actions" style="display: flex; gap: var(--spacing-sm); margin-top: var(--spacing-lg);">
                <a class="btn btn-primary" href="login.html">Go to Login</a>
                <a class="btn btn-outline" href="signup.html">Create a New Account</a>
            </div>
        </div>
    </main>

    <footer class="auth-footer">
        <div class="footer-bottom container auth-footer-bottom">
            <p>&copy; 2026 CORRIESELLS. All rights reserved.</p>
        </div>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script>
        const statusEl = document.getElementById('verifyStatus');
        const successEl = document.getElementById('verifySuccess');
        const errorEl = document.getElementById('verifyError');

        function showError(message) {
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('show');
            }
        }

        async function verifyEmail() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            if (!token) {
                if (statusEl) statusEl.textContent = 'Missing verification token.';
                showError('We could not find your verification token. Please request a new link from the login page.');
                return;
            }

            try {
                const res = await fetch(buildApiUrl(`/api/auth/verify-email?token=${encodeURIComponent(token)}`), {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.success) {
                    if (statusEl) statusEl.textContent = 'Verification failed.';
                    showError(data.error || 'This verification link is invalid or expired.');
                    return;
                }

                if (statusEl) statusEl.textContent = 'Email verified successfully.';
                if (successEl) successEl.classList.add('show');
            } catch (error) {
                if (statusEl) statusEl.textContent = 'Verification failed.';
                showError('Unable to verify your email right now. Please try again later.');
            }
        }

        verifyEmail();
    </script>
</body>
</html>
